version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: astroseva_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-astroseva}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your .env file}
      POSTGRES_DB: ${POSTGRES_DB:-astroseva}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U astroseva"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: astroseva_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: astroseva_backend
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-astroseva}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your .env file}@postgres:5432/${POSTGRES_DB:-astroseva}
      - REDIS_URL=redis://redis:6379/0
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=gemini-1.5-flash
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    # Proxy headers are trusted only from the loopback default, which is correct
    # when nginx or a load balancer runs on the same host. Behind a CDN whose
    # addresses are not loopback, set FORWARDED_ALLOW_IPS to that network or the
    # API will see the proxy's address for every request -- and since the rate
    # limiter keys on the client address, one caller could exhaust everyone's
    # quota. Do not set it to "*": then any client can forge X-Forwarded-For and
    # mint itself a fresh rate-limit bucket.
    command: >
      uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
      --proxy-headers
      --forwarded-allow-ips ${FORWARDED_ALLOW_IPS:-127.0.0.1,::1}

volumes:
  postgres_data:
  redis_data:
