name: CI

# The five gates that were previously run by hand, now run on every push.
# See README for the equivalent local commands.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push makes an in-flight run irrelevant. Cancel rather than queue, so a
# broken branch does not consume the runner while waiting.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          # Warns while resolving rather than failing on a resolution change,
          # so a new patch release cannot silently break the build.
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Lint (ruff)
        run: python -m ruff check app tests

      # app/core/planets.py calls skyfield's load(), which downloads de421.bsp
      # (~16 MB) on first use. It is gitignored, so without this cache every
      # single run re-downloads it from JPL.
      - name: Fetch the JPL ephemeris
        run: >-
          curl -fSL --retry 3 --retry-delay 5
          -o "$GITHUB_WORKSPACE/backend/de421.bsp"
          https://ssd.jpl.nasa.gov/ftp/eph/planets/bsp/de421.bsp

      - name: Cache the JPL ephemeris
        uses: actions/cache@v4
        with:
          path: backend/de421.bsp
          key: ephemeris-${{ runner.os }}-de421
          restore-keys: |
            ephemeris-${{ runner.os }}-de421

      - name: Run tests
        # Only JWT_SECRET is mandatory: app/services/auth_service.py raises at
        # import without it, which is the intended fail-fast. DATABASE_URL
        # falls back to SQLite and Redis falls back to a disk cache, so no
        # services are needed for this job.
        env:
          JWT_SECRET: ci-not-a-real-secret
          GEMINI_API_KEY: ''
        run: python -m pytest tests/ -q

  migrations:
    name: Migrations on PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: astroseva
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: astroseva
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U astroseva"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # The test suite and local development both run on SQLite, but production
      # runs PostgreSQL. batch_alter_table is the documented workaround for
      # adding a column on SQLite and its behaviour differs from a plain ALTER
      # on PostgreSQL, so a migration can pass every test and still fail on
      # deploy. This job is the only place migrations touch the real engine.
      - name: Upgrade to head
        env:
          DATABASE_URL: postgresql://astroseva:ci-password@localhost:5432/astroseva
          JWT_SECRET: ci-not-a-real-secret
        run: alembic upgrade head

      - name: Downgrade to base
        env:
          DATABASE_URL: postgresql://astroseva:ci-password@localhost:5432/astroseva
          JWT_SECRET: ci-not-a-real-secret
        run: alembic downgrade base

      - name: Upgrade again (idempotence from a clean slate)
        env:
          DATABASE_URL: postgresql://astroseva:ci-password@localhost:5432/astroseva
          JWT_SECRET: ci-not-a-real-secret
        run: alembic upgrade head

      - name: The schema has the tables the models declare
        env:
          DATABASE_URL: postgresql://astroseva:ci-password@localhost:5432/astroseva
          JWT_SECRET: ci-not-a-real-secret
        run: |
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, inspect

          engine = create_engine(os.environ["DATABASE_URL"])
          present = set(inspect(engine).get_table_names())
          expected = {
              "users", "saved_charts", "user_settings",
              "astrologers", "astrologer_documents", "astrologer_assessments",
              "astrologer_mock_consults", "astrologer_availability",
              "onboarding_events", "job_runs",
              "alembic_version",
          }
          missing = expected - present
          if missing:
              raise SystemExit(f"migrations did not create: {sorted(missing)}")
          print(f"all {len(expected)} expected tables present")
          PY

  frontend:
    name: Frontend gates
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      # Zero problems is the bar: the backlog that used to need a baseline is
      # gone, so any finding fails the run.
      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      # The browser is the one thing this job cannot borrow from the machine.
      # Locally the config drives the already-installed Chrome via
      # `channel: "chrome"`; a GitHub runner has none, so the bundled Chromium
      # is installed here instead and selected through this variable.
      - name: Install the browser
        run: npx playwright install --with-deps chromium

      - name: Install frontend dependencies
        run: npm ci

      # The e2e job starts its own backend, which imports the ephemeris at
      # startup. Same absolute path as the backend job.
      - name: Fetch the JPL ephemeris
        run: >-
          curl -fSL --retry 3 --retry-delay 5
          -o "$GITHUB_WORKSPACE/backend/de421.bsp"
          https://ssd.jpl.nasa.gov/ftp/eph/planets/bsp/de421.bsp

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      # The specs start the backend themselves, but `next build` has to happen
      # first because NEXT_PUBLIC_API_URL is inlined at build time.
      - name: Run the end-to-end specs
        run: npm run e2e
        env:
          E2E_BROWSER_CHANNEL: chromium

      - name: Upload the trace on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: frontend/test-results/
          retention-days: 7